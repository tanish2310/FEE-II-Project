<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Submission Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Submit Your Design</h2>
        <form id="designForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required>

            <label for="shoeSize">Shoe Size:</label>
            <input type="number" id="shoeSize" name="shoeSize" min="1" max="50" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="designUpload">Upload Your Design:</label>
            <input type="file" id="designUpload" name="designUpload" required>

            <button type="submit">Submit</button>
        </form>
        <p id="responseMessage"></p>
    </div>

    <script>
        document.getElementById('designForm').addEventListener('submit', function(event) {
            event.preventDefault();
            document.getElementById('responseMessage').textContent = 'Our team will reach you shortly';
        });
    </script>
</body>
</html>
